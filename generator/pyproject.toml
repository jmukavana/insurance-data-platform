[project]
name = "insurance-generator"
version = "0.1.0"
description = "Reproducible synthetic insurance data generator with labelled fraud"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
insurance-generator = "insurance_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_generator"]